rules:
  - id: py-open-variable
    message: "Potential path traversal: open() called with variable or mixed path"
    severity: WARNING
    languages: [python]
    patterns:
      - pattern: open(...)
      - pattern-not: open("...")

  - id: py-join-variable
    message: "Potential path traversal: os.path.join() with variable or mixed input"
    severity: WARNING
    languages: [python]
    patterns:
      - pattern: os.path.join(...)
      - pattern-not: os.path.join("...","...")
